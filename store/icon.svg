<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Rucksack. A path winding across contour lines toward a low sun.
       Ochre and forest green. The sun and the far half of the road sit inside
       the safe circle (centre 54,54 radius 33). The contour lines and the near
       end of the road run past it on purpose, the way land and a road do. -->
  <defs>
    <linearGradient id="rk-field" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#04201A"/>
      <stop offset="0.42" stop-color="#0C3525"/>
      <stop offset="0.76" stop-color="#154A31"/>
      <stop offset="1" stop-color="#1E5D3A"/>
    </linearGradient>
    <radialGradient id="rk-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE7AE" stop-opacity="0.66"/>
      <stop offset="0.32" stop-color="#EFAC42" stop-opacity="0.32"/>
      <stop offset="0.68" stop-color="#C97C1C" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#C97C1C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rk-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF1CB" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#F7BC52" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#EFA43A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rk-disc" x1="0.24" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#FFF6DC"/>
      <stop offset="0.4" stop-color="#FBCB68"/>
      <stop offset="1" stop-color="#DD8A14"/>
    </linearGradient>
    <linearGradient id="rk-road" x1="0" y1="1" x2="0.85" y2="0">
      <stop offset="0" stop-color="#D9BE84"/>
      <stop offset="0.4" stop-color="#F3E6BE"/>
      <stop offset="1" stop-color="#FFFBEE"/>
    </linearGradient>
    <linearGradient id="rk-cont" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F5220" stop-opacity="0.32"/>
      <stop offset="0.34" stop-color="#B98A36" stop-opacity="0.78"/>
      <stop offset="0.72" stop-color="#EFC97E"/>
      <stop offset="1" stop-color="#FFE2A6" stop-opacity="0.82"/>
    </linearGradient>
    <filter id="rk-cast" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6"/>
      <feOffset dx="-0.5" dy="2.2" result="o"/>
      <feFlood flood-color="#02150E" flood-opacity="0.7"/>
      <feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rk-blur" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
  </defs>

  <g id="bg">
    <rect width="108" height="108" fill="url(#rk-field)"/>
    <circle cx="69" cy="35" r="55" fill="url(#rk-warm)"/>
    <!-- two ridges of country standing between here and the light -->
    <path d="M0 48c11-4.4 19-1.6 30-3.4s19-5.2 31-3.8 20 4.6 30 2.8 12-3 17-4V108H0z" fill="#082A20" opacity="0.5"/>
    <path d="M0 58.5c13-6.4 24-2.6 37-5s22-6.4 34-4.4 22 5.4 37 2.6V108H0z" fill="#062419" opacity="0.4"/>
  </g>

